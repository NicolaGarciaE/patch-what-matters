[project]
name = "patch-what-matters"
version = "0.1.0"
description = "Does CVSS tell us what to patch? CVSS v3 scores vs CISA KEV exploitation for NVD CVEs published 2022-2024."
readme = "README.md"
authors = [
    { name = "Nicola García Echavarría", email = "168017368+NicolaGarciaE@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
]
